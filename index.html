<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Quick Notepad</title>

    <meta
        name="description"
        content="A simple offline note taking application.">

    <link
        rel="stylesheet"
        href="css/style.css">

</head>

<body>

    <!-- ========================= -->
    <!-- HEADER -->
    <!-- ========================= -->

    <header id="appHeader">

        <h1>Quick Notepad</h1>

    </header>

    <!-- ========================= -->
    <!-- MAIN -->
    <!-- ========================= -->

    <main id="app">

        <!-- ========================= -->
        <!-- HOME -->
        <!-- ========================= -->

        <section
            id="homeScreen"
            class="screen"
            aria-labelledby="homeHeading">

            <h2 id="homeHeading">

                Notes

            </h2>

            <div
                id="notesList"
                role="list">

                <p id="emptyMessage">

                    No notes available.

                    <br><br>

                    Select <strong>New Note</strong> to create your first note.

                </p>

            </div>

        </section>

        <!-- ========================= -->
        <!-- EDITOR -->
        <!-- ========================= -->

        <section
            id="editorScreen"
            class="screen hidden"
            aria-labelledby="editorHeading">

            <h2 id="editorHeading">

                New Note

            </h2>

            <form id="noteForm">

                <label for="noteTitle">

                    Title

                </label>

                <input
                    id="noteTitle"
                    type="text"
                    maxlength="100"
                    autocomplete="off"
                    placeholder="Enter title">

                <label for="noteContent">

                    Note

                </label>

                <textarea
                    id="noteContent"
                    rows="12"
                    placeholder="Write your note here..."></textarea>

                <button
                    id="saveNoteButton"
                    type="submit">

                    Save Note

                </button>

            </form>

        </section>

        <!-- ========================= -->
        <!-- SETTINGS -->
        <!-- ========================= -->

        <section
            id="settingsScreen"
            class="screen hidden"
            aria-labelledby="settingsHeading">

            <h2 id="settingsHeading">

                Settings

            </h2>

            <p>

                Settings will be available in a future version.

            </p>

        </section>

        <!-- ========================= -->
        <!-- ABOUT -->
        <!-- ========================= -->

        <section
            id="aboutScreen"
            class="screen hidden"
            aria-labelledby="aboutHeading">

            <h2 id="aboutHeading">

                About

            </h2>

            <p>

                <strong>Quick Notepad</strong>

            </p>

            <p>

                Version 1.0

            </p>

            <p>

                Offline note taking application built using HTML, CSS, JavaScript and Capacitor.

            </p>

        </section>

    </main>

    <!-- ========================= -->
    <!-- BOTTOM NAVIGATION -->
    <!-- ========================= -->

    <nav
        id="bottomNavigation"
        aria-label="Main Navigation">

        <button
            id="homeButton"
            type="button"
            aria-current="page">

            Home

        </button>

        <button
            id="newButton"
            type="button"
            aria-current="false">

            New Note

        </button>

        <button
            id="settingsButton"
            type="button"
            aria-current="false">

            Settings

        </button>

        <button
            id="aboutButton"
            type="button"
            aria-current="false">

            About

        </button>

    </nav>

    <script src="js/storage.js"></script>
    <script src="js/notes.js"></script>
    <script src="js/router.js"></script>
    <script src="js/app.js"></script>

</body>

</html>
